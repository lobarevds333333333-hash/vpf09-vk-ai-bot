name: PR Agent

on:
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize
  issue_comment:
    types:
      - created

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr-agent-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Review pull request
        uses: docker://pragent/pr-agent@sha256:8f1df6fa8a98e7d24be30d9b80208a927b30b5bfac88a7ae1fe24c68b47b3f08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_KEY: ${{ secrets.TEST_CODEX }}
          OPENAI__KEY: ${{ secrets.TEST_CODEX }}
          OPENAI__API_BASE: https://opencode.ai/inference/go/openai/v1
          config.model: openai/deepseek-v4.1-flash
          config.fallback_models: "[]"
          config.custom_model_max_tokens: "100000"
          config.reasoning_effort: "low"
          litellm.extra_headers: '{"x-opencode-session":"ses_pr_agent_${{ github.event.pull_request.number || github.event.issue.number }}"}'
          litellm.suppress_debug_info: "false"
          LITELLM_LOG: DEBUG
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "false"
          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review", "synchronize"]'
