name: PR Agent

on:
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize
  issue_comment:
    types:
      - created

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr-agent-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    name: PR Agent review
    if: >-
      ${{
      github.event.sender.type != 'Bot' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event_name != 'issue_comment' ||
        (github.event.issue.pull_request != null &&
         contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
         (startsWith(github.event.comment.body, '/review') ||
          startsWith(github.event.comment.body, '/ask') ||
          startsWith(github.event.comment.body, '/describe') ||
          startsWith(github.event.comment.body, '/improve'))))
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check OpenCode Go endpoint
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          curl --silent --show-error --fail-with-body \
            --header "Authorization: Bearer $OPENCODE_API_KEY" \
            --header "x-opencode-session: ses_pr_agent_${{ github.event.pull_request.number || github.event.issue.number }}" \
            "https://opencode.ai/inference/go/v1/models" \
            --output /dev/null \
            --write-out "OpenCode Go models endpoint: %{http_code}\n"

      - name: Review pull request
        uses: docker://pragent/pr-agent@sha256:8f1df6fa8a98e7d24be30d9b80208a927b30b5bfac88a7ae1fe24c68b47b3f08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENAI_API_BASE: https://opencode.ai/inference/go/openai/v1
          OPENAI_BASE_URL: https://opencode.ai/inference/go/openai/v1
          config.model: openai/minimax-m3.1-flash
          config.fallback_models: "[]"
          config.custom_model_max_tokens: "100000"
          config.ai_timeout: "180"
          config.retry_same_model_on_timeout: "false"
          config.reasoning_effort: "low"
          config.additional_reasoning_effort_models: '["minimax-m3.1-flash"]'
          litellm.extra_headers: '{"x-opencode-session":"ses_pr_agent_${{ github.event.pull_request.number || github.event.issue.number }}"}'
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "false"
          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review", "synchronize"]'
