name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    name: Python 3.11 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Compile sources
        run: python -m compileall -q bot config keyboards models services storage utils main.py tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  independent-viewer:
    name: Independent Viewer (Claude Opus 5.5)
    if: github.event_name == 'pull_request'
    needs: unittest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: independent-viewer-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Reject fork pull requests
        env:
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPOSITORY: ${{ github.repository }}
        run: |
          if [[ "$HEAD_REPOSITORY" != "$BASE_REPOSITORY" ]]; then
            echo "::error::Independent Viewer supports same-repository branches only."
            exit 1
          fi

      - name: Check out pull request head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Review exact pull request SHA
        id: viewer
        continue-on-error: true
        env:
          APIHOST_API_KEY: ${{ secrets.APIHOST_API_KEY }}
          TESTS_RESULT: ${{ needs.unittest.result }}
        run: |
          if [[ "$TESTS_RESULT" != "success" ]]; then
            echo "::error::Required Python test matrix did not succeed."
            exit 1
          fi
          python -m pipeline.viewer.review_pr \
            --workspace "$GITHUB_WORKSPACE" \
            --event-path "$GITHUB_EVENT_PATH" \
            --expected-sha "${{ github.event.pull_request.head.sha }}" \
            --base-sha "${{ github.event.pull_request.base.sha }}" \
            --tests-status "Python 3.11 Ubuntu/Windows matrix: $TESTS_RESULT" \
            --artifact-dir "viewer-artifacts" \
            --timeout-seconds 180

      - name: Update pull request summary
        if: >-
          always() &&
          steps.viewer.outcome != 'skipped' &&
          hashFiles('viewer-artifacts/viewer-summary.md') != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python -m pipeline.viewer.post_summary \
            --summary-path viewer-artifacts/viewer-summary.md

      - name: Upload viewer artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: independent-viewer-${{ github.event.pull_request.head.sha }}
          path: viewer-artifacts/
          if-no-files-found: ignore
          retention-days: 14

      - name: Enforce viewer verdict
        if: always()
        env:
          VIEWER_OUTCOME: ${{ steps.viewer.outcome }}
        run: |
          test "$VIEWER_OUTCOME" = "success"
